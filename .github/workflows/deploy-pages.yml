name: Build and Deploy Sites

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Create Firebase environment files
        env:
          FIREBASE_ENV: ${{ secrets.FIREBASE_ENV }}
        run: |
          printf '%s' "$FIREBASE_ENV" > admin-site/.env.production
          printf '%s' "$FIREBASE_ENV" > tracker-site/.env.production

      - name: Build admin-site
        working-directory: ./admin-site
        run: |
          npm ci
          npm run build -- --base=./

      - name: Build tracker-site
        working-directory: ./tracker-site
        run: |
          npm ci
          npm run build -- --base=./

      - name: Prepare publish directory
        run: |
          rm -rf public || true
          mkdir -p public/admin public/tracker
          cp -r admin-site/dist/* public/admin/
          cp -r tracker-site/dist/* public/tracker/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
